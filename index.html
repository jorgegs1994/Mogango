<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mogango | Mangos de Mogán, de una familia</title>
  <meta name="description" content="Mogango cultiva mangos en tres fincas familiares en los barrancos de Mogán, Gran Canaria. Fruta cogida a mano para fruterías, mayoristas y hostelería.">
  <meta name="theme-color" content="#12160F">
  <script>
    // Hide the hero headline until js/motion.js is ready to reveal it.
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      document.documentElement.classList.add("motion-pending");
      setTimeout(function () { document.documentElement.classList.remove("motion-pending"); }, 3000);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css">
  <link rel="stylesheet" href="css/styles.css?v=21">
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>

  <header class="topbar">
    <a class="wordmark" href="#top" aria-label="Mogango, volver arriba"><span class="logo" aria-hidden="true"></span></a>
    <nav class="topnav" aria-label="Secciones">
      <a href="#story">Fincas</a>
      <a href="#season" class="hide-sm">Temporada</a>
      <a href="#varieties" class="hide-sm">Variedades</a>
      <a href="empresas.html" class="nav-cta">Empresas</a>
      <a href="#contact">Contacto</a>
    </nav>
  </header>

  <main id="main">
    <section id="top" class="hero" data-theme="dark">
      <div class="hero-media" data-photo="hero" data-eager></div>
      <div class="hero-text">
        <h1 class="display reveal" data-copy="heroTitle"></h1>
        <p class="label hero-line" data-copy="heroLine"></p>
      </div>
      <a class="scroll-cue label" href="#intro"><span>Bajar</span><i aria-hidden="true"></i></a>
    </section>

    <section id="intro" class="intro" data-theme="light" aria-labelledby="intro-title">
      <p class="label section-label" data-copy="introLabel"></p>
      <h2 id="intro-title" class="statement reveal" data-copy="introTitle"></h2>
      <div class="intro-body">
        <div class="intro-photo" data-photo="family"></div>
        <div class="intro-text">
          <p class="since"><span class="label">Desde</span><span class="since-year" data-bind="since"></span></p>
          <p class="body-text" data-copy="introText"></p>
        </div>
      </div>
    </section>

    <section id="story" class="story" data-theme="dark" aria-labelledby="story-title">
      <h2 id="story-title" class="visually-hidden">Un recorrido por nuestras fincas</h2>
      <div class="map-stage">
        <div id="map" role="region" aria-label="Mapa de Gran Canaria con nuestras fincas"></div>
        <div class="map-shade" aria-hidden="true"></div>
        <div class="map-hud">
          <p class="label hud-count" aria-hidden="true"><span id="hud-index">01</span> / <span id="hud-total"></span></p>
          <nav class="rail" id="rail" aria-label="Paradas del recorrido"></nav>
        </div>
      </div>
      <div class="steps" id="steps"></div>
    </section>

    <section id="harvest" class="harvest" data-theme="light" aria-labelledby="harvest-title">
      <div class="harvest-head">
        <p class="label section-label" data-copy="harvestLabel"></p>
        <h2 id="harvest-title" class="display-md reveal" data-copy="harvestTitle"></h2>
      </div>
      <div class="harvest-grid">
        <figure class="harvest-a"><div data-photo="picking"></div><figcaption class="label">01 · La recogida</figcaption></figure>
        <figure class="harvest-b"><div data-photo="processing"></div><figcaption class="label">02 · Lavado y selección</figcaption></figure>
        <p class="harvest-text body-text" data-copy="harvestText"></p>
        <figure class="harvest-c"><div data-photo="packing"></div><figcaption class="label">03 · El almacén, Mogán</figcaption></figure>
      </div>
    </section>

    <section id="numbers" class="numbers" data-theme="dark" aria-labelledby="numbers-title">
      <h2 id="numbers-title" class="label section-label" data-copy="numbersLabel"></h2>
      <dl class="stats" id="stats"></dl>
    </section>

    <section id="season" class="season" data-theme="light" aria-labelledby="season-title">
      <div class="season-head">
        <p class="label section-label" data-copy="seasonLabel"></p>
        <h2 id="season-title" class="display-md reveal" data-copy="seasonTitle"></h2>
        <p class="body-text" data-copy="seasonText"></p>
      </div>
      <figure class="strip-figure">
        <div class="strip" id="strip" role="img"></div>
        <figcaption class="strip-foot">
          <span class="label" id="strip-note"></span>
          <details class="strip-table">
            <summary class="label">Ver como tabla</summary>
            <table id="strip-table"></table>
          </details>
        </figcaption>
      </figure>
    </section>

    <section id="varieties" class="varieties" data-theme="dark" aria-labelledby="varieties-title">
      <div class="v-track" id="v-track">
        <div class="v-panel v-intro">
          <p class="label section-label" data-copy="varietiesLabel"></p>
          <h2 id="varieties-title" class="display-md reveal" data-copy="varietiesTitle"></h2>
          <p class="body-text" data-copy="varietiesText"></p>
          <p class="label v-hint" aria-hidden="true">Sigue bajando <i></i></p>
        </div>
      </div>
    </section>

    <section id="empresas" class="trade-cta" data-theme="light" aria-labelledby="trade-title">
      <p class="label section-label" data-copy="tradeLabel"></p>
      <h2 id="trade-title" class="display-md reveal" data-copy="tradeTitle"></h2>
      <div class="trade-cta-foot">
        <p class="body-text" data-copy="tradeTeaser"></p>
        <a class="button" href="empresas.html">Formatos y presupuesto</a>
      </div>
    </section>

    <section id="closing" class="closing" data-theme="dark" aria-labelledby="closing-line">
      <div class="closing-stage">
        <div class="closing-media" data-photo="cut"></div>
        <p id="closing-line" class="display closing-line reveal" data-copy="closingLine"></p>
      </div>
    </section>
  </main>

  <footer id="contact" class="footer" data-theme="dark">
    <div class="footer-cols">
      <div>
        <h2 class="label">La finca</h2>
        <p class="footer-tag" data-bind="tagline"></p>
      </div>
      <div>
        <h2 class="label">Escríbenos o visítanos</h2>
        <p id="contact-lines"></p>
      </div>
      <div class="footer-shops">
        <h2 class="label">Dónde encontrarlos</h2>
        <ul id="shop-list" class="shop-list"></ul>
      </div>
    </div>
    <p class="giant" aria-hidden="true"><span class="logo"></span></p>
    <p class="fineprint label"><span>&copy; <span id="year"></span> <span data-bind="farmName">Mogango</span></span><span>Cultivados y cogidos a mano en Mogán</span></p>
  </footer>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.3.11/dist/lenis.min.js"></script>
  <script src="js/data.js?v=21"></script>
  <script src="js/map.js?v=21"></script>
  <script src="js/main.js?v=21"></script>
  <script src="js/motion.js?v=21"></script>
</body>
</html>
